server:
  port: ${PORT_API_GATEWAY:9090}

spring:
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-url: http://127.0.0.1:9090
      client:
        registration:
          client-app:
            provider: spring
            client-id: gateway-app
            client-secret: 12345
            authorization-grant-type: authrization_code
            redirect-uri: http://127.0.0.1:9090/authorizer
            scope:
            - openid
            - profile
            client-name: client-app
        provider:
          spring:
            issuer-uri: http://127.0.0.1:9090

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: oauth2
              uri: lb://msvc-oauth
              predicates:
                - Path=/api/security/**
            - id: clientes
              uri: lb://msvc-cliente
              predicates:
                - Path=/api/cliente/**
            - id: socios
              uri: lb://msvc-man-socio
              predicates:
                - Path=/api/socio/**
            - id: historial
              uri: lb://msvc-historial
              predicates:
                - Path=/api/historial/socio/**
    loadbalancer:
      configurations: default